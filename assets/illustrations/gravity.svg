<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <defs>
    <radialGradient id="g1" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f5e1ff"/>
      <stop offset="40%" stop-color="#a875ff"/>
      <stop offset="85%" stop-color="#3c1a78"/>
      <stop offset="100%" stop-color="#140a33"/>
    </radialGradient>
    <radialGradient id="g2" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#99f6e4"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="85%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="glow-g" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Gravitational Wave Ripples -->
  <ellipse cx="160" cy="100" rx="140" ry="65" stroke="url(#waveGrad)" stroke-width="1.2" stroke-dasharray="3 6" opacity="0.45"/>
  <ellipse cx="160" cy="100" rx="100" ry="46" stroke="url(#waveGrad)" stroke-width="1.6" stroke-dasharray="5 7" opacity="0.6"/>
  <ellipse cx="160" cy="100" rx="60" ry="28" stroke="url(#waveGrad)" stroke-width="2" opacity="0.75" filter="url(#glow-g)"/>
  
  <!-- Star attraction line -->
  <path d="M90 100 Q160 82 230 100" stroke="#fdf2f8" stroke-width="1.8" stroke-dasharray="2 4" opacity="0.8"/>
  
  <!-- Primary Planet (Violet) -->
  <g filter="url(#glow-g)">
    <circle cx="85" cy="100" r="32" fill="url(#g1)"/>
    <ellipse cx="85" cy="100" rx="46" ry="12" stroke="#e9d5ff" stroke-width="2.2" stroke-dasharray="70 20" transform="rotate(-18 85 100)" opacity="0.85"/>
  </g>
  
  <!-- Secondary Planet (Cyan/Azure) -->
  <g filter="url(#glow-g)">
    <circle cx="235" cy="100" r="24" fill="url(#g2)"/>
    <ellipse cx="235" cy="100" rx="34" ry="9" stroke="#99f6e4" stroke-width="1.8" stroke-dasharray="50 15" transform="rotate(22 235 100)" opacity="0.85"/>
  </g>
  
  <!-- Sparkles of attraction -->
  <path d="M160 88 L162 94 L168 96 L162 98 L160 104 L158 98 L152 96 L158 94 Z" fill="#ffffff" filter="url(#glow-g)"/>
  <circle cx="140" cy="106" r="1.5" fill="#fbcfe8"/>
  <circle cx="180" cy="94" r="1.8" fill="#a5f3fc"/>
</svg>
