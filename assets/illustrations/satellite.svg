<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="satPanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Solar panels -->
  <rect x="12" y="42" width="22" height="16" rx="2" fill="url(#satPanel)" stroke="#bae6fd" stroke-width="1.5"/>
  <line x1="23" y1="42" x2="23" y2="58" stroke="#0369a1" stroke-width="1.2"/>
  <rect x="66" y="42" width="22" height="16" rx="2" fill="url(#satPanel)" stroke="#bae6fd" stroke-width="1.5"/>
  <line x1="77" y1="42" x2="77" y2="58" stroke="#0369a1" stroke-width="1.2"/>
  <!-- Connecting struts -->
  <line x1="34" y1="50" x2="42" y2="50" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="58" y1="50" x2="66" y2="50" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Central Module -->
  <rect x="42" y="38" width="16" height="24" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="50" cy="46" r="3" fill="#38bdf8"/>
  <!-- Dish antenna -->
  <path d="M44 26 Q50 32 56 26" stroke="#f1f5f9" stroke-width="2" fill="none"/>
  <line x1="50" y1="38" x2="50" y2="29" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="50" cy="24" r="1.5" fill="#f43f5e"/>
</svg>
