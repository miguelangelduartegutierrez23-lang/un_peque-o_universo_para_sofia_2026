<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <defs>
    <radialGradient id="portalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#312e81" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#090715" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="pauseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Station Observation Window (Circular Dome) -->
  <circle cx="160" cy="100" r="75" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4"/>
  <circle cx="160" cy="100" r="70" fill="url(#portalGlow)"/>
  <circle cx="160" cy="100" r="62" stroke="#c4b5fd" stroke-width="0.8" opacity="0.6"/>

  <!-- Distant Crescent Moon through the window -->
  <path d="M195 65 A 18 18 0 0 0 180 85 A 14 14 0 0 1 195 65 Z" fill="#fef08a" opacity="0.85" filter="url(#pauseGlow)"/>

  <!-- Cosmic Tea/Coffee Cup on Station Sill -->
  <!-- Saucer -->
  <ellipse cx="160" cy="148" rx="34" ry="7" fill="#4338ca" stroke="#c084fc" stroke-width="1.2"/>
  
  <!-- Cup body -->
  <path d="M142 120 L178 120 C178 142 172 146 160 146 C148 146 142 142 142 120 Z" fill="url(#cupGrad)" stroke="#e9d5ff" stroke-width="1.5"/>
  <!-- Cup Handle -->
  <path d="M178 124 C188 124 188 138 175 140" stroke="#e9d5ff" stroke-width="1.8" fill="none"/>
  
  <!-- Star steam rising into cosmos -->
  <path d="M152 112 Q156 100 150 92 T156 78" stroke="#fbcfe8" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M162 110 Q166 98 160 90 T164 74" stroke="#c4b5fd" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M169 113 Q173 103 167 95 T172 82" stroke="#a5f3fc" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.75"/>

  <!-- Floating Star Sugar cube / Sparkles -->
  <path d="M160 68 L162 73 L167 75 L162 77 L160 82 L158 77 L153 75 L158 73 Z" fill="#ffffff" filter="url(#pauseGlow)"/>
</svg>
