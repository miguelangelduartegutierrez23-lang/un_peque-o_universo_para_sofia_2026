<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="coronaGrad" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#fde047" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <filter id="coronaGlow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <!-- Solar Corona rays -->
  <circle cx="50" cy="50" r="32" fill="url(#coronaGrad)" filter="url(#coronaGlow)"/>
  <ellipse cx="50" cy="50" rx="36" ry="24" stroke="#fed7aa" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6"/>
  <!-- Dark Moon occulting the sun -->
  <circle cx="48" cy="50" r="22" fill="#090715"/>
  <!-- Glowing Rim (Diamond ring effect) -->
  <path d="M52 29 A 22 22 0 0 1 68 44" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="68" cy="44" r="3.5" fill="#ffffff" filter="url(#coronaGlow)"/>
</svg>
