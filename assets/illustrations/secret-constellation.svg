<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" fill="none">
  <defs>
    <radialGradient id="secGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="20%" stop-color="#f472b6"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="85%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090715" stop-opacity="0"/>
    </radialGradient>
    <filter id="starBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient nebula glow -->
  <circle cx="180" cy="125" r="110" fill="url(#secGlow)" opacity="0.45"/>

  <!-- Constellation connected lines: An elegant celestial flower / star polygon -->
  <g stroke="#fbcfe8" stroke-width="1.6" opacity="0.75" stroke-dasharray="4 5">
    <line x1="180" y1="45" x2="115" y2="95"/>
    <line x1="180" y1="45" x2="245" y2="95"/>
    <line x1="115" y1="95" x2="140" y2="165"/>
    <line x1="245" y1="95" x2="220" y2="165"/>
    <line x1="140" y1="165" x2="180" y2="205"/>
    <line x1="220" y1="165" x2="180" y2="205"/>
    <!-- Inner geometry lines connecting to center star -->
    <line x1="180" y1="45" x2="180" y2="125"/>
    <line x1="115" y1="95" x2="180" y2="125"/>
    <line x1="245" y1="95" x2="180" y2="125"/>
    <line x1="140" y1="165" x2="180" y2="125"/>
    <line x1="220" y1="165" x2="180" y2="125"/>
    <line x1="180" y1="205" x2="180" y2="125"/>
  </g>

  <!-- Constellation Star Nodes -->
  <g fill="#ffffff" filter="url(#starBloom)">
    <circle cx="180" cy="45" r="4.5"/>
    <circle cx="115" cy="95" r="4"/>
    <circle cx="245" cy="95" r="4"/>
    <circle cx="140" cy="165" r="4"/>
    <circle cx="220" cy="165" r="4"/>
    <circle cx="180" cy="205" r="4.5"/>
    <!-- Center Pulsing Star -->
    <circle cx="180" cy="125" r="7" fill="#fdf2f8"/>
  </g>

  <!-- Diamond Sparkle in the Center Star -->
  <path d="M180 105 L183 121 L199 125 L183 129 L180 145 L177 129 L161 125 L177 121 Z" fill="#ffffff" filter="url(#starBloom)"/>

  <!-- Satellite background tiny stars -->
  <circle cx="65" cy="50" r="1.5" fill="#e9d5ff" opacity="0.6"/>
  <circle cx="90" cy="190" r="1.8" fill="#a7f3d0" opacity="0.7"/>
  <circle cx="295" cy="65" r="1.5" fill="#fbcfe8" opacity="0.6"/>
  <circle cx="270" cy="195" r="1.8" fill="#e0e7ff" opacity="0.7"/>
</svg>
